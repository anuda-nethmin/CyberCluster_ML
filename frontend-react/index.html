<!--
  index.html — The HTML Shell for CyberCluster ML

  This is the ONE AND ONLY HTML file in the entire application.
  Vite uses it as the entry point for both development and production builds.

  How it works:
    1. The browser loads this HTML file
    2. The <script> tag loads src/main.jsx as an ES module
    3. React's createRoot mounts the <App /> component into <div id="root">
    4. From that point on, React controls the entire page content

  SEO & Meta:
    - <meta charset="UTF-8">           : Ensures correct character encoding
    - <meta name="viewport">           : Makes the page responsive on mobile
    - <meta name="description">        : SEO description for search engines
    - <link rel="icon">                : Inline SVG favicon (shield emoji 🛡️)
    - <title>                          : Browser tab title
-->
<!doctype html>
<html lang="en">

<head>
  <!-- Character encoding -->
  <meta charset="UTF-8" />

  <!-- Inline SVG favicon — renders a shield emoji in the browser tab -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />

  <!-- Responsive viewport — ensures proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO meta description -->
  <meta name="description" content="CyberCluster — AI-Powered Vulnerability Clustering & Threat Intelligence" />

  <!-- Browser tab title -->
  <title>CyberCluster — Vulnerability Intelligence</title>
</head>

<body>
  <!-- React mount point — the entire UI is rendered inside this div -->
  <div id="root"></div>

  <!-- Load the React application entry point as an ES module -->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
